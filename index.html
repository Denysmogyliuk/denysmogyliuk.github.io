<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>Denys Mogyliuk — Front-end Engineer</title>
    <meta
      name="description"
      content="Denys Mogyliuk — front-end engineer building high-performance React & Next.js products for 10M+ daily active users. Architecture, performance, real-time systems."
    />
    <meta name="author" content="Denys Mogyliuk" />
    <meta name="robots" content="index, follow" />
    <meta
      name="keywords"
      content="Denys Mogyliuk, front-end engineer, React, Next.js, TypeScript, frontend architecture, web performance, WebRTC, WebSocket"
    />
    <link rel="canonical" href="https://denysmogyliuk.github.io/" />

    <!-- Theme color (per scheme) -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0e16" media="(prefers-color-scheme: dark)" />

    <!-- Fonts: self-hosted (preload for fast first paint) -->
    <link rel="preload" href="/fonts/neue-machina.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Icons & PWA manifest -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="profile" />
    <meta property="og:title" content="Denys Mogyliuk — Front-end Engineer" />
    <meta
      property="og:description"
      content="Front-end engineer building high-performance React & Next.js products for 10M+ daily active users."
    />
    <meta property="og:url" content="https://denysmogyliuk.github.io/" />
    <meta property="og:site_name" content="Denys Mogyliuk" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://denysmogyliuk.github.io/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Denys Mogyliuk — Front-end Engineer" />
    <meta property="profile:first_name" content="Denys" />
    <meta property="profile:last_name" content="Mogyliuk" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Denys Mogyliuk — Front-end Engineer" />
    <meta
      name="twitter:description"
      content="Front-end engineer building high-performance React & Next.js products for 10M+ daily active users."
    />
    <meta name="twitter:image" content="https://denysmogyliuk.github.io/og.png" />

    <!-- No-flash theme: apply stored theme before first paint -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {}
      })();
    </script>

    <!-- JSON-LD structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Denys Mogyliuk",
        "jobTitle": "Front-end Engineer",
        "url": "https://denysmogyliuk.github.io/",
        "email": "mailto:denysmogyliuk@gmail.com",
        "knowsAbout": [
          "React",
          "Next.js",
          "TypeScript",
          "JavaScript",
          "Web Performance",
          "Frontend Architecture",
          "WebSocket",
          "WebRTC",
          "Server-Side Rendering"
        ],
        "sameAs": [
          "https://github.com/DenysMogyliuk",
          "https://t.me/DenysMogyliuk"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
